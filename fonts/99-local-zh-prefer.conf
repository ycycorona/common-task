<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 中文字体分派：sans-serif 思源黑体；serif 霞鹜文楷；monospace/编程 霞鹜文楷 Bright Code -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW Bright Code NF</string></edit>
  </match>
  <!-- 不带语言的 monospace（终端、代码编辑器）也走 Bright Code；后面留等宽族兜底缺字 -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>LXGW Bright Code NF</family>
      <family>LXGW WenKai Mono</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
  <!-- 字符级回退（不声明语言的请求）也优先简体字形：西文保持 DejaVu，其后 SC 排在 JP 之前 -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>LXGW WenKai</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
